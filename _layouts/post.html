---
layout: default
---
<article class="post-page">
  <p class="eyebrow">RESEARCH NOTE · {{ page.date | date: "%Y.%m.%d" }}</p>
  <h1 class="record-title">{{ page.title }}</h1>
  {% if page.categories %}<p class="tag-list">{% for category in page.categories %}<span>{{ category }}</span>{% endfor %}</p>{% endif %}
  <div class="prose post-content">{{ content }}</div>
</article>
