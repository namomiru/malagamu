title: 국어사 아카이브
description: 중세국어·근세국어·근대국어·현대국어와 한국어 방언의 어휘 및 문헌 원문을 연결하는 자료실
lang: ko
timezone: Asia/Seoul
url: ""
baseurl: ""
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
collections:
  entries:
    output: true
    permalink: /dictionary/:name/
  sources:
    output: true
    permalink: /documents/:name/
defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: dictionary
  - scope:
      path: ""
      type: sources
    values:
      layout: document
  - scope:
      path: ""
      type: posts
    values:
      layout: post
plugins:
  - jekyll-feed
exclude:
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
